{% set version = "0.2.13" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-chevron
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/chevron_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/chevron/chevron_{{ version }}.tar.gz
  sha256: fd9191cbaaa3c86ead76a2b1932a4dc43ad09e1c33a2425462928b9f48ea09c6

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-checkmate >=2.1.0
    - r-dplyr >=1.1.0
    - r-dunlin >=0.1.10
    - r-forcats >=1.0.0
    - r-formatters >=0.5.11
    - r-ggplot2 >=3.4.0
    - r-glue >=1.0.0
    - r-lifecycle >=0.2.0
    - r-lubridate >=1.7.8
    - r-magrittr >=1.5
    - r-nestcolor >=0.1.1
    - r-purrr >=0.3.0
    - r-rlang >=1.0.0
    - r-rlistings >=0.2.12
    - r-rtables >=0.6.13
    - r-stringr >=1.4.1
    - r-tern >=0.9.9
    - r-tibble >=2.0.0
  run:
    - r-base
    - r-checkmate >=2.1.0
    - r-dplyr >=1.1.0
    - r-dunlin >=0.1.10
    - r-forcats >=1.0.0
    - r-formatters >=0.5.11
    - r-ggplot2 >=3.4.0
    - r-glue >=1.0.0
    - r-lifecycle >=0.2.0
    - r-lubridate >=1.7.8
    - r-magrittr >=1.5
    - r-nestcolor >=0.1.1
    - r-purrr >=0.3.0
    - r-rlang >=1.0.0
    - r-rlistings >=0.2.12
    - r-rtables >=0.6.13
    - r-stringr >=1.4.1
    - r-tern >=0.9.9
    - r-tibble >=2.0.0

test:
  commands:
    - $R -e "library('chevron')"           # [not win]
    - "\"%R%\" -e \"library('chevron')\""  # [win]

about:
  home: https://insightsengineering.github.io/chevron/, https://github.com/insightsengineering/chevron/
  license: Apache-2.0
  summary: Provide standard tables, listings, and graphs (TLGs) libraries used in clinical trials. This package implements a structure to reformat the data with 'dunlin', create reporting tables using 'rtables' and 'tern' with standardized input arguments to enable quick generation of standard outputs.  In addition, it
    also provides comprehensive data checks and script generation functionality.
  license_family: APACHE
  license_file:
    - LICENSE-2.0.txt

extra:
  recipe-maintainers:
    - conda-forge/r
